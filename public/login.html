<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Songs of Overcomer</title>
  <meta name="description" content="Sign in to Songs of Overcomer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="login-wrapper">
    <section class="login-card" aria-labelledby="card-title">
      <div class="brand-header">
        <div class="brand-lockup">
          <div class="brand-icon hidden" id="brand-icon"><img id="brand-logo" alt=""></div>
          <p class="brand-title" id="brand-title">Songs of Overcomer</p>
        </div>
        <h1 class="login-title" id="card-title">Sign in</h1>
        <p class="login-subtitle hidden" id="brand-welcome"></p>
      </div>

      <div id="alert-box" class="alert-box hidden" role="alert"></div>

      <!-- VIEW 1: SIGN IN FORM -->
      <form id="login-form" class="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username" class="form-label">Email or username</label>
          <div class="input-container">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="Email or username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
            <button type="button" id="toggle-password" class="text-btn" aria-label="Toggle password visibility">Show</button>
          </div>
          <div class="input-container">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Password"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn-primary">
          <span class="btn-text">Sign in</span>
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <span class="spinner hidden" id="login-spinner"></span>
        </button>

        <div class="form-switch-prompt">
          <span>Not part of an organisation?</span>
          <a href="/register.html" class="link-btn">Register your organisation</a>
        </div>
      </form>

    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
