<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projector Display | Oil N Wine</title>
  <link rel="icon" href="/assets/oil-n-wine-logo.webp" type="image/webp">
  <meta name="description" content="Fullscreen projector and large display presentation view for church song lyrics with real-time sync.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/display.css">
</head>
<body class="theme-clean-white">
  <!-- Dynamic Atmospheric Background -->
  <div class="display-background" id="display-background">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="mesh-overlay"></div>
  </div>

  <!-- Blackout Curtain -->
  <div class="blackout-curtain" id="blackout-curtain"></div>

  <!-- Main Presentation Container -->
  <main class="presentation-stage" id="presentation-stage">
    
    <!-- Lyrics Content Area -->
    <div class="lyrics-wrapper" id="lyrics-wrapper">
      <div class="slide-content transition-fade" id="slide-content">
        <!-- Rendered lines go here -->
        <div class="standby-screen">
          <img class="standby-logo" src="/assets/oil-n-wine-logo.webp" alt="Oil N Wine">
          <h1 class="standby-title">Oil N Wine</h1>
          <p class="standby-subtitle">Waiting for operator to project a song...</p>
        </div>
      </div>
    </div>

    <!-- Song Info / Stanza Badge (Subtle footer) -->
    <footer class="song-meta-footer" id="song-meta-footer">
      <div class="meta-badge" id="meta-badge">
        <span class="meta-title" id="meta-song-title"></span>
        <span class="meta-sep" id="meta-sep">•</span>
        <span class="meta-stanza" id="meta-stanza"></span>
      </div>
    </footer>
  </main>

  <!-- Discrete Floating Exit Fullscreen Button (Visible in Fullscreen) -->
  <button type="button" class="exit-fullscreen-btn hidden" id="btn-exit-fullscreen" title="Exit Fullscreen (Esc or F)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
    <span>Exit Fullscreen</span>
  </button>

  <!-- Floating Control Bar (Auto-hides on idle) -->
  <nav class="display-controls" id="display-controls" aria-label="Display Controls">
    <button type="button" class="ctrl-btn" id="btn-fullscreen" title="Toggle Fullscreen (F)">
      <svg class="icon-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
      <svg class="icon-compress hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
      </svg>
      <span id="fullscreen-btn-text">Fullscreen</span>
    </button>
  </nav>

  <script src="/js/display.js"></script>
</body>
</html>
